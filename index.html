<html>

<head>
    <title>Inventory List</title>
    <meta name="referrer" content="never" />
    <style type="text/css">
        body {
            background-color: #1F1E1F;
        }
    </style>
    <script>
        function makeAjaxInventoryList() {
            // create an XMLHttpRequest
            var xhttp = new XMLHttpRequest();
            // create a handler for the readyState change
            xhttp.onreadystatechange = function () {
                readyStateChangeHandler(xhttp);
            };
            // get JSON file by making async call
            xhttp.open("GET", "https://bili.drinbol.com/blive/xlive/general-interface/v1/rank/getOnlineGoldRank?ruid=473519710&roomId=23247582&page=1&pageSize=50", true);
            xhttp.send();
        }
        function readyStateChangeHandler(xhttp) {
            if (xhttp.readyState == 4) {
                // readyState = 4 means DONE
                if (xhttp.status == 200) {
                    handleStatusSuccess(xhttp);
                } else {
                    handleStatusFailure(xhttp);
                }
            }
        }
        function handleStatusFailure(xhttp) {
            //display error message
            var displayDiv = document.getElementById("display");
            displayDiv.innerHTML = "XMLHttpRequest failed: status " + xhttp.status;
        }
        function handleStatusSuccess(xhttp) {
            var jsonText = xhttp.responseText;
            //parse the json into an object
            var listObj = JSON.parse(jsonText);
            //display the object on the page
            displayList(listObj);
        }
        function displayList(listObj) {
            // construct HTML code to display weather information
            var html =  "高能榜在线: " + listObj.data.onlineNum;
            // show the constructed HTML code in the display div
            var displayDiv = document.getElementById("display");
            displayDiv.innerHTML = html;
            setTimeout(() => makeAjaxInventoryList(), 1000)
        }
    </script>
</head>

<body onload="makeAjaxInventoryList()">
    <button onClick="makeAjaxInventoryList()">Read JSON</button>
    <br /><br />
    <div id="display">
    </div>
</body>

</html>
